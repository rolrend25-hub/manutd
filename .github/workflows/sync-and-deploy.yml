name: Sync data & deploy site

# 매 실행 순서
#   1) 개인정보·비밀값 검사 (저장소 전체)      ← 항상
#   2) API 사전 점검 (키 유효성·응답 구조)      ← 항상
#   3) 동기화 필요 여부 판단 → ETL(일정·순위·선수·경기 상세·컵 대회) → 경기 요약 → 내보내기
#   3-1) 카카오톡 알림 (전날·1시간 전 리마인드, 일정 변경 안내)  ← 매 실행, 보낸 기록은 DB 에 커밋
#   4) 데이터 검증 (정합성·교차검증·직전 버전 비교)  ← ETL 을 했거나 카톡을 보낸 경우
#   5) 개인정보·비밀값 검사 (커밋 직전 staged)
#   6) 커밋·푸시 → Pages 배포
#   7) 구글 캘린더 동기화 (동기화·커밋한 경우만, 저장소 변경 없음)
#   8) 알림: 문제 있으면 GitHub 이슈(소유자 할당 → 이메일·모바일 푸시), 복구되면 자동 닫힘
# 1·2·4·5 중 하나라도 실패하면 커밋·배포하지 않음.

on:
  schedule:
    - cron: "0 5 * * *"      # 매일 05:00 UTC (KST 14:00) 전체 동기화
    - cron: "*/30 * * * *"   # 30분마다: 점검 + 경기 종료 결과 대기 중일 때만 동기화
  workflow_dispatch:
    inputs:
      test_alert:
        description: "알림 테스트 (체크하면 일부러 점검 실패를 만들어 알림 이슈 발송, 동기화·배포 안 함)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: sync-and-deploy
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash   # 명시해야 pipefail 적용 (| tee 뒤에서도 실패 감지)
    outputs:
      deploy: ${{ steps.result.outputs.deploy }}
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 준비
        run: |
          echo "REPORT_DIR=$RUNNER_TEMP/reports" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/reports"
          pip install -q -r requirements.txt
          git show HEAD:data/manutd.db > "$RUNNER_TEMP/baseline.db" || true

      - name: 1. 개인정보·비밀값 검사 (저장소 전체)
        id: privacy
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: python scripts/check_privacy.py | tee "$REPORT_DIR/1_privacy.txt"

      - name: 2. API 사전 점검
        id: sources
        if: ${{ !inputs.test_alert }}
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python scripts/check_sources.py | tee "$REPORT_DIR/2_sources.txt"

      - name: 알림 테스트 (수동 실행 시에만)
        id: testalert
        if: ${{ inputs.test_alert }}
        run: |
          echo "✗ [테스트] 알림 경로 점검용으로 일부러 만든 실패입니다. 다음 정상 실행 때 자동으로 닫힙니다." | tee "$REPORT_DIR/0_test.txt"
          exit 1

      - name: 동기화 필요 여부 판단
        id: gate
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python scripts/sync_needed.py

      - name: 3. 데이터 수집(ETL) + 내보내기
        id: etl
        if: steps.gate.outputs.run == 'true'
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          { python etl/fetch_fixtures.py && python etl/fetch_standings.py && python etl/fetch_players.py \
            && python etl/fetch_match_details.py \
            && { python etl/fetch_cups.py || echo "⚠ FA컵·EFL컵(위키백과) 수집 실패 — 이번 실행은 건너뜀" | tee "$REPORT_DIR/3_cups.txt"; } \
            && python scripts/summarize_match.py && python scripts/export_site_data.py; } 2>&1 | tee "$RUNNER_TEMP/etl.log"

      - name: 3-1. 카카오톡 알림 (리마인드·일정 변경)
        id: kakao
        if: ${{ !inputs.test_alert && steps.sources.outcome == 'success' && steps.etl.outcome != 'failure' }}
        continue-on-error: true   # 실패해도 이미 보낸 기록은 아래에서 커밋 (중복 발송 방지), 실패는 알림 이슈로
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}   # 새 리프레시 토큰을 Secrets 에 자동 저장
        run: python notify/send_kakao.py 2>&1 | tee "$REPORT_DIR/3_kakao.txt"

      - name: 4. 데이터 검증
        id: validate
        if: steps.etl.outcome == 'success' || steps.kakao.outputs.changed == 'true'
        run: python scripts/validate_data.py --baseline "$RUNNER_TEMP/baseline.db" | tee "$REPORT_DIR/4_validate.txt"

      - name: 5. 개인정보·비밀값 검사 (커밋 직전)
        id: staged
        if: steps.validate.outcome == 'success'
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: |
          git add data/manutd.db site/data
          python scripts/check_privacy.py --staged | tee "$REPORT_DIR/5_staged.txt"

      - name: 6. 커밋·푸시
        id: commit
        if: steps.staged.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: auto sync $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: 7. 구글 캘린더 동기화 (일정·시간 변경·결과)
        id: calendar
        if: steps.commit.outcome == 'success'
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: python notify/sync_calendar.py 2>&1 | tee "$REPORT_DIR/7_calendar.txt"

      - name: 배포 여부 결정
        id: result
        if: always()
        run: |
          # 검사·검증을 모두 통과했을 때만 배포 (동기화했거나 코드 push 인 경우)
          if [ "${{ steps.privacy.outcome }}" = "success" ] && [ "${{ steps.sources.outcome }}" = "success" ] \
             && { [ "${{ steps.commit.outcome }}" = "success" ] || \
                  { [ "${{ github.event_name }}" = "push" ] && [ "${{ steps.gate.outputs.run }}" != "true" ]; }; }; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pages 아티팩트 업로드
        if: steps.result.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 8. 알림 (문제 시 이슈 생성 / 복구 시 닫기)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT_PRIVACY: ${{ steps.privacy.outcome }}
          OUT_SOURCES: ${{ steps.testalert.outcome == 'failure' && 'failure' || steps.sources.outcome }}
          OUT_ETL: ${{ steps.etl.outcome }}
          OUT_KAKAO: ${{ steps.kakao.outcome }}
          OUT_VALIDATE: ${{ steps.validate.outcome }}
          OUT_STAGED: ${{ steps.staged.outcome }}
          OUT_COMMIT: ${{ steps.commit.outcome }}
          OUT_CALENDAR: ${{ steps.calendar.outcome }}
        run: |
          if [ "${{ steps.etl.outcome }}" = "failure" ]; then
            { echo "✗ ETL 실패 (마지막 로그):"; tail -n 15 "$RUNNER_TEMP/etl.log" | sed 's/^/✗   /'; } > "$REPORT_DIR/3_etl.txt"
          fi
          python scripts/notify_status.py

  deploy:
    needs: sync
    if: needs.sync.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
